name: pipeline-demo

# Corre el pipeline sobre los datos de ejemplo y verifica que genera la app.
# (Los datos reales nunca están en el repo, así que esto usa data/sample/.)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install -r requirements.txt
      - name: Correr pipeline (datos de ejemplo)
        run: python src/run_pipeline.py
      - name: Publicar la app de demo
        uses: actions/upload-artifact@v4
        with:
          name: app-demo
          path: app/index.html
